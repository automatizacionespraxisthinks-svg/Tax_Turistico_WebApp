server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Quién pide qué queda en los logs de Dokploy; el cuerpo no, que lleva
    # teléfonos y direcciones de clientes (§8.2).
    access_log /var/log/nginx/access.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Las teselas de Paipa: 2,9 MB que el mapa pide por rangos de bytes.
    # `bytes` es lo que hace que MapLibre descargue solo el trozo que necesita
    # en vez del fichero entero en cada movimiento del mapa.
    location /tiles/ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # nginx no conoce la extension .mjs: su `mime.types` solo mapea `js`, asi
    # que el worker de MapLibre salia como `application/octet-stream`. Un
    # worker de modulo exige un tipo de JavaScript, el navegador lo rechaza y
    # el mapa se queda en blanco — el mismo sintoma que cuando el worker ni
    # siquiera se copiaba, por una causa distinta.
    #
    # `types { }` vacia la tabla, pero solo dentro de este bloque, que no
    # sirve otra cosa; `default_type` pone el tipo que falta. Va en un
    # `location` con expresion regular a proposito: asi gana al de `/assets/`
    # sin tener que duplicar nada mas que la cache.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Las tipografias del mapa, servidas aqui y no desde un CDN. Van con
    # `=404` a proposito: si faltara un rango, el `try_files` de abajo lo
    # resolveria con el index.html y MapLibre recibiria HTML donde espera un
    # protobuf. Es el mismo fallo silencioso que dejo el mapa en blanco, y asi
    # no puede repetirse: un 404 se ve, un HTML disfrazado no.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Los paquetes llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El index no se cachea nunca: es quien apunta a los paquetes nuevos
    # después de un despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        # Repetidas aquí a propósito: en nginx, un `location` con su propio
        # `add_header` descarta los del servidor. Y como el enrutado del SPA
        # cae en este bloque por `try_files`, sin esto el documento HTML
        # —el único que importa para clickjacking— se quedaría sin ellas.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Enrutado del lado del cliente: cualquier ruta desconocida la resuelve
    # React Router, no nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El panel no se incrusta en ningún sitio.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

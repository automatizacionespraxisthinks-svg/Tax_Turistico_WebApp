<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <!-- Un solo tema, claro (HU-UI-01): se ve igual al sol y de noche, y el
         modo oscuro del sistema no lo cambia. -->
    <meta name="color-scheme" content="light" />
    <!-- La tinta de la cabecera, para que la barra del celular la continúe.
         Sale de --ink en tokens.css; lo pone vite.config.ts al servir. -->
    <meta name="theme-color" content="%COLOR_TEMA%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <!--
      Safari en iOS ignora los iconos del manifiesto para la pantalla de
      inicio: usa este. Sin el, el icono acaba siendo una captura de la
      pagina, que es lo que delata a una aplicacion mal instalada.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Conductor" />
    <title>Conductor · Tax Turístico</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

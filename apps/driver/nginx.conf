server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # El service worker NO se cachea. Es la pieza que decide qué versión usa
    # el teléfono: si un proxy o el navegador se queda con uno viejo, el
    # conductor sigue con la aplicación de hace semanas y no hay forma de
    # sacarlo de ahí sin que desinstale.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Mismo motivo: es lo que apunta a los paquetes nuevos tras un despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        # Repetidas aquí a propósito: en nginx, un `location` con su propio
        # `add_header` descarta los del servidor. Y como el enrutado del SPA
        # cae en este bloque por `try_files`, sin esto el documento HTML
        # —el único que importa para clickjacking— se quedaría sin ellas.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # Los paquetes llevan hash en el nombre: inmutables.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
